---
name: Build container image

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 3 * * TUE'
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "MLIT Atomic OS"
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Rechunking writes a second full copy of the image. PR builds skip
      # rechunking: they never push, and it doubles the build time.
      - name: Maximize build space
        if: github.event_name != 'pull_request'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master

      - name: Install just
        if: github.event_name != 'pull_request'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      # Fail closed: every external image the Containerfile pulls must be pinned
      # by digest and signed with a vendored key (refreshed by update-vendored)
      - name: Verify source image signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stages < <(sed -nE 's/^FROM .* [Aa][Ss] ([^ ]+)$/\1/p' Containerfile)
          mapfile -t refs < <(grep -oE '(^FROM |--from=|,from=)[^ ,]+' Containerfile | sed -E 's/^(FROM |--from=|,from=)//' | sort -u)

          verified=0
          for ref in "${refs[@]}"; do
            if [[ "$ref" == scratch ]] || printf '%s\n' "${stages[@]}" | grep -qxF "$ref"; then
              continue
            fi
            if [[ ! "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ref} is not pinned by digest"
              exit 1
            fi
            case "$ref" in
              quay.io/fedora-ostree-desktops/*) key=.github/cosign/quay.io-fedora-ostree-desktops.pub ;;
              ghcr.io/ublue-os/*) key=.github/cosign/ghcr.io-ublue-os.pub ;;
              *)
                echo "::error::No cosign key configured for ${ref}"
                exit 1
                ;;
            esac
            echo "Verifying ${ref} with ${key}"
            cosign verify --key "$key" "$ref" > /dev/null
            verified=$((verified + 1))
          done

          if [[ $verified -eq 0 ]]; then
            echo "::error::No source images found in Containerfile"
            exit 1
          fi

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      # Mirrors (RPM Fusion, Terra) flake on GitHub runners: retry the build up
      # to 3 times, each attempt runs only if the previous one failed
      - name: Build Image
        id: build_image
        continue-on-error: true
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with: &build_image_with
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.DEFAULT_TAG }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      - name: Build Image (attempt 2)
        id: build_image_2
        if: steps.build_image.outcome == 'failure'
        continue-on-error: true
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with: *build_image_with

      - name: Build Image (attempt 3)
        if: steps.build_image_2.outcome == 'failure'
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with: *build_image_with

      # Split into package-based layers so clients download only what changed
      - name: Rechunk Image
        if: github.event_name != 'pull_request'
        run: just rechunk "${{ env.IMAGE_NAME }}" "${{ env.DEFAULT_TAG }}"

      # Tag for registry
      - name: Tag for registry
        run: |
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag ${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} ${{ env.IMAGE_NAME }}:$tag
          done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The first push of a tag drops the rechunker's layer annotations, so it
      # gets a different (unsigned) digest. Pushing twice makes all tags match.
      # https://github.com/containers/podman/issues/27796
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        run: |
          digest_file="$(mktemp)"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            for _ in 1 2; do
              podman push --digestfile "${digest_file}" "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            done
          done
          echo "digest=$(cat "${digest_file}")" >> "${GITHUB_OUTPUT}"

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # bootc/skopeo only read the legacy `sha256-<digest>.sig` tag; cosign v3
        # defaults to the new bundle format stored as an OCI referrer. Both flags
        # are required: without them v3 breaks verification on clients.
        # https://github.com/containers/container-libs/issues/388
        # https://github.com/coreos/rpm-ostree/issues/5509
        run: cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # cosign verify accepts either signature format, but bootc/skopeo only read
      # the legacy simple-signing `sha256-<digest>.sig` tag, so check it directly
      - name: Verify published image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          cosign verify --key cosign.pub "${image}@${DIGEST}" > /dev/null
          skopeo inspect --raw "docker://${image}:${DIGEST/:/-}.sig" \
            | jq -e '.layers[] | select(.mediaType == "application/vnd.dev.cosign.simplesigning.v1+json")' > /dev/null
