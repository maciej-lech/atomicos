---
name: Validate Actions Lockfile

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails when actions.lock is out of sync with workflows or a locked pin no longer verifies upstream
  verify:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      GH_ACTIONS_LOCK_VERSION: v0.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"

      - name: Verify lockfile
        run: gh actions-lock --verify
