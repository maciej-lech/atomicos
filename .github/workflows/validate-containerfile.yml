---
name: Validate Containerfile

on:
  pull_request:
    paths:
      - "Containerfile"
      - ".github/hadolint.yaml"
      - ".github/workflows/validate-containerfile.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Hadolint
        uses: docker://docker.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          args: /bin/hadolint --config .github/hadolint.yaml Containerfile
