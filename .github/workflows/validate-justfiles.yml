---
name: Validate Justfiles

on:
  pull_request:
    paths:
      - "Justfile"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install just
        uses: extractions/setup-just@v4.0.0

      - name: Validate Justfiles
        shell: bash
        run: |
          set -xeuo pipefail

          echo "::group:: Validating Justfile"
          just --unstable --fmt --check -f Justfile
          echo "::endgroup::"

          echo "All justfiles are valid"
