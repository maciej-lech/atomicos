# Keep this kickstart table: without one BIB injects clearpart --all and
# autopart, wiping the first disk without asking.
#
# BIB's own %post records the origin as ostree-unverified-registry:, so updates
# would skip /etc/containers/policy.json. This kickstart %includes BIB's first,
# so the %post below runs later and re-records the same reference as
# ostree-image-signed:. The Justfile replaces @IMAGE_REF@ with the reference it
# passes to BIB.
[customizations.installer.kickstart]
contents = """
# Interactive install: everything is chosen in Anaconda's interface.

%post --erroronfail
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry @IMAGE_REF@
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
