# NTS-authenticated servers (RFC 8915); NTS-KE needs outbound TCP 4460
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server ntppool1.time.nl iburst nts
server time.dfm.dk iburst nts

minsources 3

driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync

ntsdumpdir /var/lib/chrony

leapseclist /usr/share/zoneinfo/leap-seconds.list

# Close UDP command port 323; root chronyc still works via /run/chrony/chronyd.sock.
# Non-root chronyc needs the port, so remove this line to use it.
cmdport 0

# Not an NTP server; keep no client access history
noclientlog

logdir /var/log/chrony
