# Stock unit trims only /etc/fstab entries when fstab is non-empty, and the
# ostree root (/sysroot) is never listed there.
[Unit]
Documentation=https://forge.fedoraproject.org/atomic/tracker/issues/81

[Service]
ExecStart=
ExecStart=/usr/bin/fstrim --listed-in /proc/self/mountinfo --verbose --quiet-unsupported
