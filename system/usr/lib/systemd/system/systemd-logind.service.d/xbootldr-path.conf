# /boot is an XBOOTLDR partition, but ostree's /boot/loader is a symlink that
# logind refuses to follow, so BootLoaderEntries and Manager GetAll fail and niri
# loses login1 lid tracking. Point logind at an empty directory instead; GRUB does
# not use logind's boot loader entries.
# TODO: drop once https://github.com/systemd/systemd/issues/44636 is fixed
[Service]
Environment=SYSTEMD_XBOOTLDR_PATH=/usr/share/empty
