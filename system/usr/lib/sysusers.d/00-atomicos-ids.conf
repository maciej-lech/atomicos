# Pinned IDs for the accounts the image adds on top of the base image (#442).
# build/01-users.sh creates them before any package install, so packages keep
# these IDs instead of allocating new ones on every build; on hosts, sysusers
# uses them for accounts missing from the local /etc/passwd. Entries here win
# over the package lines, which sysusers then logs as conflicts and ignores.
# build/90-cleanup.sh fails the build if an account in /etc is not pinned here.
#
# Base image /usr/lib/passwd allocates downward from 999: keep dynamic pins in
# 800-829 (users) and 830-849 (groups only). IDs below 200 are package-static.
# Changing a pin needs a manual ID move and chown on existing hosts.

u  clevis         800 "Clevis Decryption Framework unprivileged user" /var/cache/clevis -
u  davfs2         801 "User account for davfs2" /var/cache/davfs2 -
u  dhcpcd         802 "Minimalistic DHCP client" /var/lib/dhcpcd -
u  gluster        803 "GlusterFS daemons" /run/gluster -
u  greetd         804 "greetd daemon" /var/lib/greetd -
u  greeter        805 "System Greeter" /var/lib/greeter /bin/bash
u  libvirtdbus    806 "Libvirt D-Bus bridge" - -
u  nm-openconnect 807 "NetworkManager user for OpenConnect" - -
u! nm-openvpn     808 "NetworkManager OpenVPN" - -
u  openvpn        809 "OpenVPN" /etc/openvpn -
u  setroubleshoot 810 "SELinux troubleshoot server" /var/lib/setroubleshoot -
u  wsdd           811 "Web Services Dynamic Discovery host daemon" - -

g  ccache         830
g  docker         831
g  incus          832
g  incus-admin    833
g  libvirt        834
g  qat            835

g  wbpriv         88
u  qemu           107 "qemu user" - -
g  stapusr        156
g  stapsys        157
g  stapdev        158
u  stapunpriv     159 "systemtap unprivileged user" - -
