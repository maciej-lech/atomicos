# Image owns the greetd config; L+ restores the symlink at boot after `dms-greeter sync` replaces it
L+ /etc/greetd/config.toml - - - - /usr/share/factory/etc/greetd/config.toml
# Seed only; `dms-greeter sync` rewrites it with an include of the synced dms.kdl
d /etc/greetd/niri 0755 root greeter - -
C /etc/greetd/niri/config.kdl - - - - /usr/share/factory/etc/greetd/niri/config.kdl
